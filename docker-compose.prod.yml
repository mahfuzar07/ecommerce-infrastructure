# =============================================================================
# Production Master Orchestrator (Docker Compose v2.20+ Modular Architecture)
# Composes individual project compose files together with Nginx & Certbot.
# =============================================================================

include:
  - path: ../ecommerce-nest-api/docker/docker-compose.prod.yml
  - path: ../ecommerce-store/docker-compose.prod.yml
  - path: ../ecommerce-portal-new/docker-compose.prod.yml

services:
  # =========================================================================
  # Nginx Reverse Proxy (SSL Termination & Multi-App Routing)
  # =========================================================================
  nginx:
    image: nginx:1.27-alpine
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M
    container_name: ecommerce-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - app
      - store
      - portal
    networks:
      - ecommerce_network

  # =========================================================================
  # Certbot (Automated Let's Encrypt SSL Certificates)
  # =========================================================================
  certbot:
    image: certbot/certbot:latest
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M
    container_name: ecommerce-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Note: schedule a host cron or deploy-hook (`docker compose exec -T nginx nginx -s reload`)
    # after certificate renewal so Nginx picks up renewed Let's Encrypt certificates.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - ecommerce_network

# ===========================================================================
# Volumes & Networks
# ===========================================================================
volumes:
  certbot_conf:
    name: ecommerce_certbot_conf
  certbot_www:
    name: ecommerce_certbot_www

networks:
  ecommerce_network:
    name: ecommerce_network
