# =============================================================================
# NestJS Backend API - HTTPS Configuration (api.yourdomain.com)
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Replace with your production API domain
    server_name api.yourdomain.com;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # SSL Parameters & Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ApiSSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum file upload size (for product media, 100MB videos, avatars, invoices)
    client_max_body_size 105M;

    # Block public Prometheus metrics scraping at the edge
    location = /metrics {
        deny all;
        return 403;
    }

    # -------------------------------------------------------------------------
    # Server-Sent Events (SSE) Routes for Shopper & Staff Realtime Streams
    # -------------------------------------------------------------------------
    location ~* ^/api/v[0-9]+/(notification|employee-auth)/sse {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        # Disable buffering and caching for instantaneous SSE event streaming
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Keep connection open for persistent streams
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Main API Routing
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        # WebSocket / Connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for heavy API operations (e.g. PDF generation, bulk exports)
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
    }
}
