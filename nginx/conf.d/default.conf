# =============================================================================
# HTTP (Port 80) - ACME Challenge & Automatic HTTPS Redirection
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt / Certbot Webroot Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
